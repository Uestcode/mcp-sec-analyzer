[project]
name = "mcp-sec-analyzer"
version = "0.1.0"
description = "MCP Server for Defensive Security, Binary Triage, and Reverse Engineering Analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5.0.9",
    "mcp>=1.0.0",
    "pefile>=2024.8.26",
    "pyelftools>=0.33",
]

[project.scripts]
mcp-sec-analyzer = "mcp_sec_analyzer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
